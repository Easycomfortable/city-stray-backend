# 服务端口配置
server:
  port: 9090

# Spring 核心配置
spring:
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/city_stray?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: Llf@1234
  # Redis 缓存配置
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 5000ms
  # JSON 序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.citystray.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Knife4j 接口文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# JWT 令牌配置
jwt:
  secret: CityStraySecretKey2026ForGraduationProjectVeryLongKey
  expiration: 86400000

# 日志级别配置
logging:
  level:
    com.citystray: debug


# 微信小程序配置
wx:
  miniapp:
    appid: wx_your_appid
    secret: your_appid_secret
  pay:
    appid: wx_your_appid
    mch-id: your_mch_id
    api-key: your_api_key
    notify-url: https://your-domain.com/api/wx/pay/notify
